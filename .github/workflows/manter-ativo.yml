name: Manter agendamento ativo
# O GitHub desliga agendamentos de repositórios públicos sem atividade por 60 dias.
# Este passo grava só a data de hoje num arquivo, uma vez por mês (nenhum dado da fazenda).
on:
  schedule:
    - cron: "17 12 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ultima-atividade
          git config user.name "robo-cocho"
          git config user.email "robo-cocho@users.noreply.github.com"
          git add .ultima-atividade
          git commit -m "manter agendamento ativo" || echo "nada a fazer"
          git push
