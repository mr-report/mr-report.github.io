name: Publicar app
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/publicar-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      # o GitHub às vezes não acha o arquivo recém-enviado ("No artifacts named github-pages"): espera e tenta de novo
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
