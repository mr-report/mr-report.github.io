name: Coleta diária

on:
  schedule:
    - cron: "30 0 * * *"   # 21:30 (Brasília) – o PDF costuma chegar às 21:00
    - cron: "30 1 * * *"   # 22:30 – nova tentativa, caso o e-mail atrase
    - cron: "30 2 * * *"   # 23:30 – nova tentativa
    - cron: "0 10 * * *"   # 07:00 – última tentativa + conferência (avisa por e-mail se faltar relatório)
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias para trás buscar no e-mail (use 120, por exemplo, para importar o histórico)"
        default: "3"
        required: true

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - name: Coletar relatórios do e-mail
        working-directory: coletor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FAZENDAS: ${{ secrets.FAZENDAS }}
          DIAS: ${{ inputs.dias || '3' }}
        run: python coletar.py --dias "$DIAS"
      - name: Conferir se o relatório de ontem chegou (só às 07:00)
        if: github.event.schedule == '0 10 * * *'
        working-directory: coletor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FAZENDAS: ${{ secrets.FAZENDAS }}
        run: python coletar.py --verificar
